name: go
on: workflow_call
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: SAYSO_RESULTS="$RUNNER_TEMP/results-go.json" go test -count=1 -race ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-go
          path: ${{ runner.temp }}/results-go.json
          if-no-files-found: error
