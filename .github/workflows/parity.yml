name: parity
# The one entry point. Both suites run as called workflows in this run, so the parity job reads their artifacts from
# the same run and never checks out or executes code from a different event's context.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I tools/manifest.py --check
      - run: python3 -I -m unittest discover -s tools -p 'test_*.py'
  go:
    uses: ./.github/workflows/go.yml
  swift:
    uses: ./.github/workflows/swift.yml
  parity:
    needs: [tools, go, swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: results
      - name: Both suites' results are required
        run: test -f results/results-go/results-go.json && test -f results/results-swift/results-swift.json
      - run: python3 -I tools/parity.py results/results-go/results-go.json results/results-swift/results-swift.json
  differential:
    # Both implementations on the same generated inputs (tools/differential.py). It builds both oracles itself and
    # reads no other job's results. A fixed seed plus the run number tries new cases on every run; the printed seed
    # reproduces a failure with --seed.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Run both implementations on generated cases
        run: |
          seed=$((20261016 + GITHUB_RUN_NUMBER))
          echo "differential seed: $seed"
          python3 -I tools/differential.py --seed "$seed"
