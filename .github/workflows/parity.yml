name: parity
# The one entry point. Both suites run as called workflows in this run, so the parity job reads their artifacts from
# the same run and never checks out or executes code from a different event's context.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/manifest.py --check
      - run: python3 -I -m unittest discover -s tools -p 'test_*.py'
  go:
    uses: ./.github/workflows/go.yml
  swift:
    uses: ./.github/workflows/swift.yml
  parity:
    needs: [tools, go, swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Both suites' results are required
        run: test -f results/results-go/results-go.json && test -f results/results-swift/results-swift.json
      - run: python3 -I tools/parity.py results/results-go/results-go.json results/results-swift/results-swift.json
