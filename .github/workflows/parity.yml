name: parity
# The one entry point. Both suites run as called workflows in this run, so the parity job reads their artifacts from
# the same run and never checks out or executes code from a different event's context.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tools:
    # The fake app server is used by the suites on both systems, so its own tests run on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -I tools/manifest.py --check
      - run: python3 -I -m unittest discover -s tools -p 'test_*.py'
  go:
    uses: ./.github/workflows/go.yml
  swift:
    uses: ./.github/workflows/swift.yml
  parity:
    needs: [tools, go, swift]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          path: results
      - name: Every suite's results are required
        run: |
          test -f results/results-go-macos-15/results-go.json
          test -f results/results-go-ubuntu-latest/results-go.json
          test -f results/results-swift/results-swift.json
      - run: >-
          python3 -I tools/parity.py results/results-go-macos-15/results-go.json
          results/results-go-ubuntu-latest/results-go.json results/results-swift/results-swift.json
