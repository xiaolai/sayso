name: swift
on: workflow_call
permissions:
  contents: read
jobs:
  test:
    # Two SDKs: macos-15's Xcode 16 has no FoundationModels and none of the macOS 26 declarations, so it builds the
    # fallbacks; macos-26's Xcode 26 builds the code behind them. A local Xcode is newer than both.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The runner's compiler is older than a current local one, so its version goes in the log.
      - run: swift --version
      - run: swift build -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete
      - run: swift build -Xswiftc -warnings-as-errors -Xswiftc -swift-version -Xswiftc 6
      - run: SAYSO_RESULTS="$RUNNER_TEMP/results-swift.json" swift test
      # Strict concurrency takes an @unchecked Sendable type at its word; only the sanitizer sees its races. No
      # results file: the run above is the one parity reads.
      - run: swift test --sanitize=thread
      # The said guard's CPU bounds are tighter in a release build, which the runs above never make.
      - run: swift test -c release -Xswiftc -enable-testing --filter SaidGuardLimitsTests
      # Every product builds for iOS (Package.swift); CodexAuth's API is macOS-only and builds there to nothing.
      - run: xcodebuild build -scheme SaySo-Package -destination 'generic/platform=iOS' -quiet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-swift-${{ matrix.os }}
          path: ${{ runner.temp }}/results-swift.json
          if-no-files-found: error
